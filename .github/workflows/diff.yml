name: 'Create ROBOT diffs on Pull requests'

# Comment "#gogoeditdiff" on a PR to get an edit-file diff and a classified (-base) diff
# posted back to the PR.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: gogoeditdiff-${{ github.event.issue.number }}
  cancel-in-progress: true

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  check:
    # Filter at job level so ordinary PR comments don't start any runner or pull the ODK image.
    # Only people with write access can trigger it: the PR's Makefile gets executed below.
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '#gogoeditdiff') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
    steps:
      - name: Acknowledge the trigger comment
        run: gh api -X POST "repos/$REPO/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes
      - name: Get PR head
        id: pr
        run: echo "head_sha=$(gh pr view "$PR" -R "$REPO" --json headRefOid -q .headRefOid)" >> "$GITHUB_OUTPUT"
      - name: Check branch is up to date with ${{ env.DEFAULT_BRANCH }}
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          behind=$(gh api "repos/$REPO/compare/$DEFAULT_BRANCH...$HEAD_SHA" -q .behind_by)
          echo "Branch is $behind commit(s) behind $DEFAULT_BRANCH"
          if [ "$behind" -ge 1 ]; then
            # Use the same marker as the diff report so the PR keeps a single, updated comment.
            printf '<!-- GOGOEDITDIFF -->\nYour branch is %s commit/s behind, please update your branch and comment `#gogoeditdiff` again.\n' "$behind" > comment.md
            id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
              -q '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- GOGOEDITDIFF -->"))) | .id' | head -n1)
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
            else
              gh pr comment "$PR" -R "$REPO" --body-file comment.md
            fi
            exit 1
          fi

  classify_branch:
    needs: check
    runs-on: ubuntu-latest
    container: obolibrary/odkfull:v1.6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.head_sha }}
          path: branch
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          path: master
          persist-credentials: false
      - name: Diff edit file
        run: export ROBOT_JAVA_ARGS=-Xmx6G; robot diff --labels True --left master/src/ontology/cl-edit.owl --left-catalog master/src/ontology/catalog-v001.xml --right branch/src/ontology/cl-edit.owl --right-catalog branch/src/ontology/catalog-v001.xml -f markdown -o edit-diff.md
      - name: Classify ontology
        run: cd branch/src/ontology; make IMP=FALSE PAT=FALSE MIR=FALSE cl-base.owl
      - uses: actions/upload-artifact@v6
        with:
          name: edit-diff
          path: edit-diff.md
      - uses: actions/upload-artifact@v6
        with:
          name: cl-base-pr
          path: branch/src/ontology/cl-base.owl
          retention-days: 1

  classify_main:
    needs: check
    runs-on: ubuntu-latest
    container: obolibrary/odkfull:v1.6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          persist-credentials: false
      - name: Classify ontology
        run: cd src/ontology; make IMP=FALSE PAT=FALSE MIR=FALSE cl-base.owl
      - uses: actions/upload-artifact@v6
        with:
          name: cl-base-master
          path: src/ontology/cl-base.owl
          retention-days: 1

  diff_classification:
    needs: [classify_branch, classify_main]
    runs-on: ubuntu-latest
    container: obolibrary/odkfull:v1.6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: cl-base-master
          path: master-base
      - uses: actions/download-artifact@v7
        with:
          name: cl-base-pr
          path: pr-base
      - name: Diff classification
        run: export ROBOT_JAVA_ARGS=-Xmx6G; robot diff --labels True --left master-base/cl-base.owl --left-catalog src/ontology/catalog-v001.xml --right pr-base/cl-base.owl --right-catalog src/ontology/catalog-v001.xml -f markdown -o classification-diff.md
      - uses: actions/upload-artifact@v6
        with:
          name: classification-diff
          path: classification-diff.md

  post_comment:
    needs: [check, classify_branch, diff_classification]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      HEAD_SHA: ${{ needs.check.outputs.head_sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: classification-diff
      - uses: actions/download-artifact@v7
        with:
          name: edit-diff
      - name: Post diffs
        run: |
          # Keep a single report comment per PR: edit the existing one in place if there is one,
          # otherwise create it.
          section() {
            summary="$1"; diff="$2"
            echo "<details>"
            echo "<summary>$summary</summary>"
            echo
            if [ "$(wc -c < "$diff")" -gt 60000 ]; then
              head -c 60000 "$diff" | iconv -f utf-8 -t utf-8 -c
              echo
              echo "**Diff truncated** – download the full file from the [workflow run]($RUN_URL)."
            else
              cat "$diff"
            fi
            echo
            echo "</details>"
            echo
          }
          {
            echo "<!-- GOGOEDITDIFF -->"
            echo "### ROBOT diff report for ${HEAD_SHA:0:7}"
            echo
            section "Here's a diff of how these changes impact the classified ontology (on -base file)" classification-diff.md
            section "Here's a diff of your edit file (unreasoned)" edit-diff.md
            echo "_Last updated by [workflow run]($RUN_URL)._"
          } > comment.md

          ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            -q '.[] | select(.user.login == "github-actions[bot]" and (.body | test("^<!-- (GOGOEDITDIFF|REASONED|UNREASONED) -->"))) | "\(.id) \(.body | startswith("<!-- GOGOEDITDIFF -->"))"')
          id=$(echo "$ids" | awk '$2 == "true" {print $1; exit}')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" -R "$REPO" --body-file comment.md
          fi
          # Remove comments left by the older two-comment format.
          echo "$ids" | awk '$2 == "false" {print $1}' |
            while read -r old; do gh api -X DELETE "repos/$REPO/issues/comments/$old"; done
