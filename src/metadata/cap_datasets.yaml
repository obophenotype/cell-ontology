# Curated list of CAP (Cell Annotation Platform) reference datasets to
# pull into src/templates/cap_links.tsv.
#
# Per issue #3875, "reference" datasets here are the official Human Cell
# Atlas (HCA) datasets hosted on CAP. New entries should be official HCA
# datasets; non-HCA reference datasets need a separate discussion in a
# tracker issue first.
#
# Each entry drives one GET to the CAP API. The script preserves manual
# rows in the template and only rewrites rows flagged as generated.
#
# Fields:
#   project_id  : integer CAP project ID from the URL
#   dataset_id  : integer CAP dataset ID from the URL
#   title       : display title that appears in the link label
#                 (concatenated with the fixed prefix)
#   species     : optional, written to the bookkeeping column
#   tissue      : optional, written to the bookkeeping column
#   source_issue: optional, the tracker issue that justified adding this
#                 dataset (for provenance in the TSV)
#   cl_field    : optional, the field in the CAP label JSON that carries
#                 the CL mapping (defaults to "cl_term")

datasets: []
